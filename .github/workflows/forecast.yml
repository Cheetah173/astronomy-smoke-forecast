
name: Update Astronomy Aerosol Forecast

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: astronomy-smoke-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run offline checks
        run: python -m unittest discover -s tests -v
      - name: Fetch real forecast
        run: python forecast.py
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update regional aerosol forecast"
            git push
          fi
