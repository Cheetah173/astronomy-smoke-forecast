
name: Update Astronomy Aerosol Forecast

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: astronomy-smoke-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run offline checks
        run: python -m unittest discover -s tests -v

      - name: Fetch real forecast
        run: python forecast.py

      - name: Install NOAA decoder
        run: python -m pip install "eccodes>=2.43,<3"

      - name: Probe NOAA column smoke
        continue-on-error: true
        run: python noaa_probe.py
        
      - name: Extract NOAA smoke time series
        continue-on-error: true
        run: python noaa_timeseries.py
        
      - name: Inspect NOAA vertical levels
        continue-on-error: true
        run: python noaa_vertical_inventory.py
        
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update regional aerosol forecast"
            git push
          fi
